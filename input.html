<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="aaa">
    <button onclick="abes()">CLICK</button><br><br> 
   Welcome to <p id="sri"></p>  
 <script>
    function abes(){
      let x= document.getElementById("aaa");
      let y=x.value; //to access the value of x
      document.getElementById("sri").innerHTML=y;
       
    }
    abes();
 </script>
</body>
</html>
