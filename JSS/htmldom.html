<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML DOM EXAMPLE</title>
</head>
<body>
    <button onclick="addparagraph()">Add paragraph</button>
   <div id="para1"></div>
    <p>This is old paragraph</p>
   
   <div class="para2"></div>
  <script>
    function addparagraph(){
     
        // const id=document.getElementsByClassName("para2");
        // id[0].appendChild(para);  //since the method is returning multiple value this we have given array 

      //to make changes in multiple divs 
        const id=document.querySelectorAll("div");
      id.forEach((id1) => {
            const para= document.createElement("p");
        para.textContent="This is a new paragraph";
        para.style.background="blue";
        para.style.color="white";
        id1.appendChild(para);

        });
        
        
    }
  </script>

</body>
</html>
